# Render Web (free) + Neon Postgres (แนะนำ — เสถียรกว่า Render free DB)
# 1) สร้าง DB ฟรีที่ https://console.neon.tech → copy Connection string
# 2) Dashboard Render → New → Blueprint → เลือก repo นี้
# 3) กรอก APP_KEY, APP_URL, DB_URL / DATABASE_URL ใน Environment
services:
  - type: web
    name: inventory-pos
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Inventory POS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: RUN_SEED
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_URL
        sync: false
